[package]
name = "memecoin-staking"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "memecoin_staking"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl = "0.31.0"

# No dev-dependencies. The test suite is TypeScript (tests/staking_bullbank.ts),
# run against a validator by `anchor test`; there are no Rust unit tests, and
# nothing in this crate ever referenced litesvm or the solana-* crates that were
# listed here. They were pulling `indexmap >= 2.12`, which requires edition2024
# and cannot be parsed by the rustc 1.79 inside Solana platform-tools v1.43 — so
# unused test scaffolding was breaking the build of the program itself.


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
